[package]
name = "video-vault"
version = "0.1.35"
description = "影匣 — 本地离线视频库与播放器"
authors = ["Video Vault"]
edition = "2024"
default-run = "video-vault"

[lib]
name = "video_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
walkdir = "2.5.0"
zip = { version = "2", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate",
    "deflate64",
    "time",
    "zstd",
] }
blake3 = "1.8.7"
uuid = { version = "1.29.2", features = ["v4"] }
natord = "1.0.9"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
